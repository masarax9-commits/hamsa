<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>همسة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{--bg:#ece6df;--card:#f8f5f1;--ink:#4b4038;--mute:#9b8f85;--line:#e2dad1;--acc:#86725f;--accd:#6f5d4c;--soft:#efe8df;--red:#d64545;--sh:0 2px 10px rgba(110,90,70,.10);--gl:rgba(255,255,255,.5);--glb:rgba(255,255,255,.72);--gls:inset 0 1px 0 rgba(255,255,255,.85),0 8px 26px rgba(110,90,70,.13);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1916;--card:#282320;--ink:#efe7de;--mute:#a49689;--line:#3a332e;--acc:#a28a74;--accd:#8d765f;--soft:#332d28;--sh:none;--gl:rgba(255,255,255,.07);--glb:rgba(255,255,255,.15);--gls:inset 0 1px 0 rgba(255,255,255,.12),0 8px 26px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#1d1916;--card:#282320;--ink:#efe7de;--mute:#a49689;--line:#3a332e;--acc:#a28a74;--accd:#8d765f;--soft:#332d28;--sh:none;--gl:rgba(255,255,255,.07);--glb:rgba(255,255,255,.15);--gls:inset 0 1px 0 rgba(255,255,255,.12),0 8px 26px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;font-size:16px}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg);background:radial-gradient(circle at 12% 6%,color-mix(in srgb,var(--acc) 42%,transparent),transparent 46%),radial-gradient(circle at 95% 52%,color-mix(in srgb,var(--acc) 30%,transparent),transparent 50%),radial-gradient(circle at 18% 96%,color-mix(in srgb,var(--acc) 36%,transparent),transparent 46%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;width:22px;height:22px}
svg.f{fill:currentColor;stroke:none}
#scr{flex:1;overflow-y:auto;padding:12px 18px 104px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.top h2{margin:0;font-size:19px;font-weight:700}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.ib.bg{background:var(--card);box-shadow:var(--sh)}
.hero{text-align:center;padding:14px 0 22px}
.hero svg{width:44px;height:44px;color:var(--acc)}
.hero h1{margin:6px 0 4px;font-size:38px;font-weight:700;letter-spacing:.5px}
.hero p{margin:0;color:var(--mute);font-size:15px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:var(--card);box-shadow:var(--sh);border-radius:20px;padding:20px 10px;text-align:center;position:relative}
.tile svg{width:30px;height:30px;color:var(--acc)}
.tile b{display:block;margin:8px 0 4px;font-size:17px}
.tile span{font-size:12.5px;color:var(--mute);line-height:1.5;display:block}
.dot{position:absolute;top:12px;right:14px;background:var(--red);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;font-weight:700;padding:0 4px}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:#fff;border-radius:26px;padding:14px;font-weight:500;font-size:16px;box-shadow:var(--sh)}
.btn:active{background:var(--accd)}
.btn svg{width:20px;height:20px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.quote{text-align:center;color:var(--mute);font-size:13.5px;margin-top:26px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:14px;color:var(--mute)}
.search input{border:0;background:none;padding:12px 0;flex:1}
input,textarea{font:inherit;color:var(--ink);outline:0;width:100%}
.row{display:flex;align-items:center;gap:12px;background:var(--card);box-shadow:var(--sh);border-radius:16px;padding:12px 10px 12px 12px;margin-bottom:10px;position:relative}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:#5d5249}
.av svg{width:22px;height:22px}
.inf{flex:1;min-width:0}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt{font-size:13px;color:var(--mute);margin-top:2px}
.wa{width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--acc);display:grid;place-items:center;flex:none;text-decoration:none}
.wa svg{width:18px;height:18px}
.menu{position:absolute;left:38px;top:40px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 22px rgba(60,40,20,.2);min-width:120px;display:none;z-index:6;overflow:hidden}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:right;padding:11px 16px;font-size:15px}
.menu .del{color:var(--red)}
.fab{position:absolute;left:20px;bottom:104px;width:54px;height:54px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(80,60,40,.3);z-index:4}
.fab svg{width:26px;height:26px}
.banner{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.banner svg{width:34px;height:34px;color:var(--acc)}
.banner b{display:block;font-size:17px}.banner span{font-size:13px;color:var(--mute)}
.ncard{background:var(--card);box-shadow:var(--sh);border-radius:18px;padding:14px;margin-bottom:12px}
.ncard .h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ncard .rd{width:9px;height:9px;border-radius:50%;background:var(--red)}
.empty{text-align:center;color:var(--mute);padding:50px 20px;line-height:1.8}
.empty b{display:block;color:var(--ink);font-size:17px}
.avbig{width:92px;height:92px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin:4px auto 18px;color:var(--mute)}
.avbig svg{width:44px;height:44px}
.fl{font-size:14px;margin:14px 4px 6px;font-weight:500}
.fld{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;color:var(--mute)}
.fld input{border:0;background:none;padding:14px 0}
.fld input[type=tel]{direction:ltr;text-align:right}
.fld:focus-within{border-color:var(--acc)}
.err{color:var(--red);font-size:13px;min-height:18px;margin:10px 4px 0}
.two{display:flex;gap:12px;margin-top:14px}.two .btn{flex:1}
.set{display:flex;align-items:center;gap:12px;background:var(--card);box-shadow:var(--sh);border-radius:16px;padding:16px;margin-bottom:12px;width:100%;text-align:right}
.set svg{color:var(--acc)}
.set .inf b{display:block}.set .inf span{font-size:12.5px;color:var(--mute)}
.tg{width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:right .2s}
.tg.on{background:var(--acc)}.tg.on::after{right:23px}
nav{display:flex;position:absolute;left:0;right:0;bottom:0;z-index:4;margin:0 14px 12px;border-radius:26px;padding:8px 6px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mute);position:relative;padding:4px 0}
nav button.on{color:var(--ink);font-weight:700}
nav button.on::after{content:"";width:18px;height:3px;border-radius:2px;background:var(--acc);margin-top:2px}
nav .dot{top:-2px;right:calc(50% - 20px)}
.shade{position:absolute;inset:0;background:rgba(40,28,18,.45);visibility:hidden;opacity:0;transition:opacity .28s ease,visibility 0s .28s;z-index:20}
.shade.open{visibility:visible;opacity:1;transition:opacity .28s ease}
.drawer{position:absolute;top:0;bottom:0;right:0;width:72%;background:var(--acc);color:#fff;border-radius:28px 0 0 28px;padding:70px 22px;transform:translateX(100%);transition:transform .35s cubic-bezier(.22,1,.36,1);z-index:21}
.shade.open .drawer{transform:none}
.drawer button{display:flex;align-items:center;gap:14px;width:100%;padding:15px 4px;font-size:17px;color:#fff;text-align:right}
.sheet{position:absolute;bottom:0;left:0;right:0;background:var(--card);border-radius:22px 22px 0 0;padding:20px 18px 24px;z-index:21;transform:translateY(100%);transition:transform .35s cubic-bezier(.22,1,.36,1)}
.sheet h3{margin:0 0 8px}
.sheet textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.sheet .hint{font-size:12px;color:var(--mute);margin:4px 2px 0}
button,.btn,.tile,.set{transition:transform .15s ease,background .2s}
.btn:active,.tile:active,.set:active,.ib:active,.fab:active{transform:scale(.96)}
.row{transition:transform .3s ease,opacity .3s ease,max-height .35s ease,margin .35s ease,padding .35s ease;max-height:90px}
.row.out{opacity:0;transform:translateX(-30px);max-height:0;margin-bottom:0;padding-top:0;padding-bottom:0;overflow:hidden}
.shade.open .sheet{transform:none}
.dlg{position:absolute;left:50%;top:50%;width:84%;max-width:340px;background:var(--card);border-radius:24px;padding:24px 20px 18px;text-align:center;transform:translate(-50%,-46%) scale(.94);opacity:0;transition:transform .3s cubic-bezier(.22,1,.36,1),opacity .25s;z-index:21}
.shade.open .dlg{transform:translate(-50%,-50%);opacity:1}
.dlg h3{margin:0 0 6px;font-size:18px}.dlg p{margin:0 0 18px;color:var(--mute);font-size:14px}
.btn.red{background:var(--red)}
.act{display:flex;align-items:center;gap:14px;width:100%;padding:16px 8px;font-size:17px;border-radius:14px;text-align:right}
.act:active{background:var(--soft)}.act.del{color:var(--red)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 12px}
#scr{scroll-behavior:smooth;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.in{animation:inn .32s cubic-bezier(.22,1,.36,1)}
@keyframes inn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
body{-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tile,.row,.ncard,.set,.search,.fld,.banner,.ib.bg,nav{background:var(--gl);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--glb);box-shadow:var(--gls)}
nav{-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5)}
nav button{border-radius:20px;padding:6px 0}
nav button.on{background:var(--glb)}
.btn,.fab{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 86%,#fff),var(--accd));border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 20px rgba(90,70,50,.25)}
.btn.ghost{background:var(--gl);color:var(--ink);border:1px solid var(--glb);box-shadow:var(--gls);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.btn.red{background:linear-gradient(180deg,#ea7a7a,var(--red))}
.wa{background:var(--gl);border:1px solid var(--glb);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.sheet,.dlg{background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);border:1px solid var(--glb)}
.avbig{background:var(--gl);border:1px solid var(--glb);box-shadow:var(--gls)}
select{font:inherit}
.fld select{appearance:none;-webkit-appearance:none;border:0;background:none;font-size:15px;color:var(--ink);width:100%;padding:14px 0;text-align:center;text-align-last:center;outline:0}
.fld select option{color:#222}
.dsel{display:grid;grid-template-columns:1fr 1.5fr 1.3fr;gap:8px}
.row{cursor:pointer}.row:active{transform:scale(.985)}
.gbig{width:118px;height:118px;border-radius:50%;margin:6px auto 14px;display:grid;place-items:center;color:var(--acc);background:var(--gl);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--glb);box-shadow:var(--gls)}
.gbig svg{width:56px;height:56px}
.dn{text-align:center;margin:0;font-size:24px;font-weight:700}
.dp{text-align:center;color:var(--mute);margin:4px 0 16px;font-size:16px}
.cd{margin-top:16px;border-radius:22px;padding:18px 14px 14px;text-align:center;background:var(--gl);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--glb);box-shadow:var(--gls)}
.cdt{font-size:14px;color:var(--mute);margin-bottom:12px}
.cdg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cdg div{border-radius:14px;padding:10px 0;background:var(--soft)}
.cdg b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.cdg span{font-size:12px;color:var(--mute)}
.cds{margin-top:12px;font-size:14px;color:var(--mute)}
.tdy{font-size:22px;font-weight:700;padding:6px 0}
#xta{direction:ltr;text-align:left;font-size:12px}
.hint2{color:var(--mute);font-size:13px;margin:0 0 10px}
.dlg .btn{width:100%}
.auth{position:absolute;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column;overflow-y:auto;padding:28px 24px 24px}
.auth.open{display:flex}
.auth .brand{text-align:center;padding:22px 0 18px}
.auth .brand svg{width:46px;height:46px;color:var(--acc)}
.auth .brand h1{margin:6px 0 4px;font-size:38px;font-weight:700}
.auth .brand p{margin:0;color:var(--mute);font-size:15px}
.auth .skip{margin:auto auto 0;padding:14px;color:var(--mute);font-size:14px;text-decoration:underline}
.af .or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px;margin:18px 0 6px}
.af .or::before,.af .or::after{content:"";flex:1;height:1px;background:var(--line)}
.af .fld{margin-top:10px}
.af .fld input{direction:ltr;text-align:right}
.af .fld input::placeholder{direction:rtl}
.af .alt{display:flex;justify-content:space-between;gap:8px;margin-top:14px;font-size:13.5px}
.af .alt button{color:var(--accd);padding:6px 4px}
.af .err.ok{color:#3d8b5a}
.af .btn:disabled{opacity:.6;pointer-events:none}
.pf{text-align:center}
.pf .avbig{overflow:hidden}.pf .avbig img{width:100%;height:100%;object-fit:cover}
.pf .pn{font-size:19px;font-weight:700;margin:0}
.pf .pe{color:var(--mute);font-size:14px;margin:4px 0 0;direction:ltr}
.pf .ps{margin:14px 0 4px;font-size:14px;color:var(--mute);line-height:1.7}
</style>
</head>
<body>
<div id="app">
  <div id="scr"></div>
  <nav id="nav"></nav>
  <div class="shade" id="shd"><div class="drawer" id="drw"></div></div>
  <div class="shade" id="sha"><div class="sheet" id="shaB"></div></div>
  <div class="shade" id="shc"><div class="dlg" id="dlg"></div></div>
  <div class="shade" id="shx"><div class="sheet" id="shxB"></div></div>
  <div class="shade" id="shm"><div class="sheet">
    <h3>التذكير والرسالة</h3>
    <div class="fl">أوقات التذكير الثلاثة في يوم الميلاد</div>
    <div class="fld" style="gap:6px"><input id="t0" type="time"><input id="t1" type="time"><input id="t2" type="time"></div>
    <div class="fl">مفتاح الدولة (بدون +)</div>
    <div class="fld"><input id="sCC" type="tel" placeholder="962"></div>
    <div class="fl">نص الرسالة</div>
    <textarea id="sMsg" rows="3"></textarea>
    <div class="hint">اكتب {name} ليُستبدل باسم الشخص.</div>
    <div class="two"><button class="btn ghost" id="sNo">إلغاء</button><button class="btn" id="sOk">حفظ</button></div>
  </div></div>
  <div class="shade" id="shp"><div class="sheet" id="shpB"></div></div>
  <div class="auth" id="auth">
    <div class="brand"><svg viewBox="0 0 24 24"><path d="M20 12v9H4v-9M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 1 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 1 0 0-5C13 2 12 7 12 7z"/></svg><h1>همسة</h1><p>سجّل الدخول لتحفظ بياناتك في حسابك</p></div>
    <div id="authForm"><div class="empty" style="padding:20px">جارٍ تحميل خدمة الحساب…</div></div>
    <button class="skip" data-a="skip">المتابعة بدون حساب</button>
  </div>
</div>
<script>
(function(){
function S(p,c){return '<svg viewBox="0 0 24 24"'+(c?' class="'+c+'"':'')+'>'+p+'</svg>'}
var I={
gift:S('<path d="M20 12v9H4v-9M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 1 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 1 0 0-5C13 2 12 7 12 7z"/>'),
bell:S('<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.700 21a2 2 0 0 1-3.400 0"/>'),
users:S('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.900M16 3.100a4 4 0 0 1 0 7.800"/>'),
home:S('<path d="M3 10l9-7 9 7v11H3zM9 21v-7h6v7"/>'),
gear:S('<circle cx="12" cy="12" r="3"/><path d="M19.400 15a1.650 1.650 0 0 0 .33 1.820l.06.060a2 2 0 0 1-2.830 2.830l-.06-.06a1.650 1.650 0 0 0-1.820-.33 1.650 1.650 0 0 0-1 1.510V21a2 2 0 0 1-4 0v-.09A1.650 1.650 0 0 0 9 19.400a1.650 1.650 0 0 0-1.820.33l-.06.06a2 2 0 0 1-2.830-2.830l.06-.06a1.650 1.650 0 0 0 .33-1.820 1.650 1.650 0 0 0-1.510-1H3a2 2 0 0 1 0-4h.09A1.650 1.650 0 0 0 4.600 9a1.650 1.650 0 0 0-.33-1.820l-.06-.06a2 2 0 0 1 2.830-2.830l.06.06a1.650 1.650 0 0 0 1.820.33H9a1.650 1.650 0 0 0 1-1.510V3a2 2 0 0 1 4 0v.09a1.650 1.650 0 0 0 1 1.510 1.650 1.650 0 0 0 1.820-.33l.06-.06a2 2 0 0 1 2.830 2.830l-.06.06a1.650 1.650 0 0 0-.33 1.820V9a1.650 1.650 0 0 0 1.510 1H21a2 2 0 0 1 0 4h-.09a1.650 1.650 0 0 0-1.510 1z"/>'),
user:S('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'),
phone:S('<path d="M22 16.900v3a2 2 0 0 1-2.200 2 19.800 19.800 0 0 1-8.600-3.100 19.500 19.500 0 0 1-6-6A19.800 19.800 0 0 1 2.100 4.200 2 2 0 0 1 4.100 2h3a2 2 0 0 1 2 1.700c.1 1 .4 1.900.7 2.800a2 2 0 0 1-.5 2.100L8 9.900a16 16 0 0 0 6 6l1.300-1.300a2 2 0 0 1 2.100-.4c.9.300 1.800.6 2.800.7a2 2 0 0 1 1.700 2z"/>'),
cal:S('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'),
back:S('<path d="M5 12h14M12 5l7 7-7 7"/>'),
search:S('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.300-4.300"/>'),
plus:S('<path d="M12 5v14M5 12h14"/>'),
up:S('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>'),
down:S('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>'),
dots:S('<circle cx="12" cy="5" r="1.800"/><circle cx="12" cy="12" r="1.800"/><circle cx="12" cy="19" r="1.800"/>','f'),
menu:S('<path d="M4 7h16M4 12h10"/>'),
trash:S('<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>'),

 $('shc').classList.add('open')}
function doDel(id){closeAll();var el=$('r'+id);
 function fin(){people=people.filter(function(p){return p.id!==id});save();if(view==='form'||view==='detail')go('list');else render()}
 if(el&&view==='list'){el.classList.add('out');setTimeout(fin,330)}else fin()}
async function sched(){
 if(!LN)return;
 try{
  var r=await LN.checkPermissions();if(r.display!=='granted')r=await LN.requestPermissions();if(r.display!=='granted')return;
  var pd=await LN.getPending();if(pd.notifications.length)await LN.cancel({notifications:pd.notifications.map(function(n){return {id:n.id}})});
  if(!st.notif)return;
  var now=new Date(),y0=now.getFullYear(),list=[];
  people.forEach(function(p){var d=p.date.split('-');
   for(var yo=0;yo<3;yo++){var y=y0+yo;if(p.done===y)continue;
    for(var s=0;s<3;s++){var h=(st.t[s]||'09:00').split(':'),at=new Date(y,+d[1]-1,+d[2],+h[0],+h[1],0);
     if(at>now)list.push({id:p.n*100+yo*10+s,title:'🎂 اليوم عيد ميلاد '+p.name,body:'اضغط لإرسال التهنئة أو اختر «تم» لإيقاف التذكير',schedule:{at:at,allowWhileIdle:true},actionTypeId:'BDAY',extra:{pid:p.id}})}}});
  if(list.length)await LN.schedule({notifications:list});
 }catch(e){}
}
function initN(){if(!LN)return;
 LN.registerActionTypes({types:[{id:'BDAY',actions:[{id:'done',title:'تم ✓'},{id:'open',title:'فتح'}]}]}).catch(function(){});
 LN.addListener('localNotificationActionPerformed',function(e){
  var x=e.notification&&e.notification.extra||{};
  if(e.actionId==='done'){var p=people.filter(function(o){return o.id===x.pid})[0];if(p){p.done=new Date().getFullYear();save()}}
  view='note';render()});
 sched()}
load();render();initN();
try{if(!localStorage.getItem('bd2_gate'))$('auth').classList.add('open')}catch(e){}
setTimeout(function(){var f=$('authForm');if(f&&!window.HamsaCloud&&$('auth').classList.contains('open'))f.innerHTML='<div class="err" style="text-align:center">تعذر تحميل خدمة الحساب. تحتاج اتصالًا بالإنترنت أول مرة، أو تابع بدون حساب.</div>'},8000);
window.addEventListener('hamsa-auth',function(){if(view==='settings')render()});
window.HamsaApp={
 get:function(){return JSON.parse(JSON.stringify({people:people,st:st}))},
 set:function(d){
  people=Array.isArray(d.people)?d.people:[];st=Object.assign(st,d.st||{});
  people.forEach(function(p){if(!p.n)p.n=st.nn++;if(p.n>=st.nn)st.nn=p.n+1});
  try{localStorage.setItem('bd2_p',JSON.stringify(people));localStorage.setItem('bd2_s',JSON.stringify(st))}catch(e){}
  setTimeout(sched,0);
  var a=document.activeElement,typing=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  if(view!=='form'&&!typing)render()}
};
})();

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,GoogleAuthProvider,signInWithPopup,signInWithCredential,signOut} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

var firebaseConfig={
  apiKey:"AIzaSyAEP8d_P3bbDHBszPUjagbI5Nfi6UYfIQA",
  authDomain:"hamsa-app-897ef.firebaseapp.com",
  projectId:"hamsa-app-897ef",
  storageBucket:"hamsa-app-897ef.firebasestorage.app",
  messagingSenderId:"15094310863",
  appId:"1:15094310863:web:380fbf29a3db707f67d4ba"
};
var app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
var L=localStorage,user=null,ver=0,busy=false,syncing=false,timer=0,status='',lastErr='',lastPull=0;
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function svg(p){return '<svg viewBox="0 0 24 24">'+p+'</svg>'}
function tmo(p,ms){return Promise.race([p,new Promise(function(_,r){setTimeout(function(){r(new Error('timeout'))},ms)})])}
function isNative(){return !!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())}
function nativeAuth(){return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.FirebaseAuthentication}

/* ---------- المزامنة مع Firestore ---------- */
function ref(){return doc(db,'users',user.uid,'data','main')}
function payload(){var d=window.HamsaApp.get();return {people:d.people,st:d.st,v:1,updatedAt:serverTimestamp()}}
function setStatus(s,e){status=s;lastErr=e||'';if($('shp').classList.contains('open')&&user)renderProfile()}
function schedulePush(){ver++;if(!user)return;setStatus('pending');clearTimeout(timer);timer=setTimeout(flush,700)}
async function flush(){
  if(!user||busy||L.getItem('bd2_dirty')!=='1')return;
  if(navigator.onLine===false){setStatus('offline');return}
  busy=true;var v=ver;
  try{
    await tmo(setDoc(ref(),payload()),15000);
    L.setItem('bd2_uid',user.uid);
    if(v===ver){L.removeItem('bd2_dirty');setStatus('ok')}
  }catch(e){setStatus(navigator.onLine===false?'offline':'error',e&&e.code||e&&e.message)}
  busy=false;
  if(L.getItem('bd2_dirty')==='1'&&v!==ver)flush();
}
function apply(c){
  var cur=window.HamsaApp.get();
  L.removeItem('bd2_dirty');L.setItem('bd2_uid',user.uid);
  if(JSON.stringify(cur.people)!==JSON.stringify(c.people||[])||JSON.stringify(cur.st)!==JSON.stringify(c.st||{}))
    window.HamsaApp.set({people:c.people||[],st:c.st||{}});
  setStatus('ok');
}
function merge(c){
  var cur=window.HamsaApp.get(),key=function(p){return p.name+'|'+p.phone+'|'+p.date},seen={},ids={},out=cur.people.slice();
  cur.people.forEach(function(p){seen[key(p)]=1;ids[p.id]=1});
  (c.people||[]).forEach(function(p,i){
    if(seen[key(p)])return;
    delete p.n;if(ids[p.id])p.id=Date.now()+i;ids[p.id]=1;out.push(p)});
  window.HamsaApp.set({people:out,st:Object.assign({},cur.st,c.st||{})});
}
async function initialSync(){
  if(!user||syncing)return;
  syncing=true;lastPull=Date.now();
  var uid=user.uid;
  try{
    var snap=await tmo(getDoc(ref()),12000);
    var dirty=L.getItem('bd2_dirty')==='1',same=L.getItem('bd2_uid')===uid,hasLocal=L.getItem('bd2_p')!==null;
    if(snap.exists()){
      var c=snap.data();
      if(same){ if(dirty){await flushNow()} else apply(c) }
      else if(!hasLocal){apply(c)}               // جهاز جديد: تنزيل
      else{merge(c);L.setItem('bd2_dirty','1');ver++;await flushNow()} // بيانات محلية قبل الدخول: دمج ثم رفع
    }else{
      if(hasLocal){L.setItem('bd2_dirty','1');ver++;await flushNow()} // أول دخول: رفع البيانات الحالية
      else{L.setItem('bd2_uid',uid);setStatus('ok')}
    }
  }catch(e){setStatus(navigator.onLine===false?'offline':'error',e&&e.code||e&&e.message)}
  syncing=false;
}
async function flushNow(){busy=false;await flush()}

/* ---------- واجهة الدخول ---------- */
var ERR={
 'auth/invalid-email':'البريد الإلكتروني غير صحيح.',
 'auth/missing-password':'اكتب كلمة السر.',
 'auth/invalid-credential':'البريد أو كلمة السر غير صحيحة.',
 'auth/wrong-password':'البريد أو كلمة السر غير صحيحة.',
 'auth/user-not-found':'البريد أو كلمة السر غير صحيحة.',
 'auth/email-already-in-use':'هذا البريد مسجّل مسبقًا، جرّب تسجيل الدخول.',
 'auth/weak-password':'كلمة السر ضعيفة، اكتب 6 أحرف على الأقل.',
 'auth/network-request-failed':'لا يوجد اتصال بالإنترنت.',
 'auth/too-many-requests':'محاولات كثيرة، انتظر قليلًا ثم أعد المحاولة.',
 'auth/operation-not-allowed':'طريقة الدخول هذه غير مفعّلة في Firebase.',
 'auth/unauthorized-domain':'هذا النطاق غير مضاف في Authorized domains داخل Firebase.',
 'auth/popup-blocked':'المتصفح منع نافذة Google، اسمح بالنوافذ المنبثقة.'
};
async function googleLogin(){
  if(isNative()&&nativeAuth()){
    var r=await nativeAuth().signInWithGoogle();
    var cred=GoogleAuthProvider.credential(r.credential&&r.credential.idToken);
    await signInWithCredential(auth,cred);
  }else{
    await signInWithPopup(auth,new GoogleAuthProvider());
  }
}
var G='<svg viewBox="0 0 24 24" style="stroke:none;fill:none"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>';
function mountAuth(box){
  var mode='in';
  box.innerHTML='<div class="af"><button class="btn ghost g">'+G+'المتابعة بحساب Google</button>'+
   '<div class="or">أو بالبريد الإلكتروني</div>'+
   '<div class="fld">'+svg('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>')+'<input class="em" type="email" placeholder="البريد الإلكتروني" autocomplete="email"></div>'+
   '<div class="fld">'+svg('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>')+'<input class="pw" type="password" placeholder="كلمة السر" autocomplete="current-password"></div>'+
   '<div class="err"></div><button class="btn go">تسجيل الدخول</button>'+
   '<div class="alt"><button class="mode">ليس لديك حساب؟ أنشئ حسابًا</button><button class="fg">نسيت كلمة السر؟</button></div></div>';
  var q=function(s){return box.querySelector(s)},err=q('.err');
  function msg(t,ok){err.textContent=t||'';err.className='err'+(ok?' ok':'')}
  function lock(b){box.querySelectorAll('.btn').forEach(function(x){x.disabled=b})}
  function fail(e){
    var c=e&&e.code||'';
    if(/cancel|popup-closed/i.test(c+' '+(e&&e.message||'')))return;
    msg(ERR[c]||('تعذر تسجيل الدخول'+(c?' ('+c+')':'')+'.'))}
  function setMode(m){mode=m;q('.go').textContent=m==='in'?'تسجيل الدخول':'إنشاء الحساب';
    q('.mode').textContent=m==='in'?'ليس لديك حساب؟ أنشئ حسابًا':'لديك حساب؟ سجّل الدخول';
    q('.pw').autocomplete=m==='in'?'current-password':'new-password';msg('')}
  async function submit(){
    var em=q('.em').value.trim(),pw=q('.pw').value;
    if(!em){msg('اكتب بريدك الإلكتروني.');return}
    if(!pw){msg('اكتب كلمة السر.');return}
    msg('');lock(true);
    try{ if(mode==='in')await signInWithEmailAndPassword(auth,em,pw);else await createUserWithEmailAndPassword(auth,em,pw) }
    catch(e){fail(e)}
    lock(false)}
  q('.g').onclick=async function(){msg('');lock(true);try{await googleLogin()}catch(e){fail(e)}lock(false)};
  q('.go').onclick=submit;
  q('.pw').onkeydown=function(e){if(e.key==='Enter')submit()};
  q('.mode').onclick=function(){setMode(mode==='in'?'up':'in')};
  q('.fg').onclick=async function(){
    var em=q('.em').value.trim();
    if(!em){msg('اكتب بريدك أولًا ثم اضغط «نسيت كلمة السر».');return}
    try{await sendPasswordResetEmail(auth,em);msg('أرسلنا رابط إعادة تعيين كلمة السر إلى بريدك.',true)}catch(e){fail(e)}};
}
var ST={ok:'✓ بياناتك محفوظة في حسابك',pending:'جارٍ الحفظ…',syncing:'جارٍ المزامنة…',offline:'لا يوجد اتصال. سيُرفع كل تغيير تلقائيًا عند عودة الإنترنت.'};
var confirmOut=false;
function renderProfile(){
  var b=$('shpB');
  if(!user){
    b.innerHTML='<div class="grab"></div><h3>تسجيل الدخول</h3><p class="hint2">سجّل الدخول ليُحفظ كل ما تضيفه في حسابك وتجده على أي جهاز.</p><div id="pfForm"></div>';
    mountAuth($('pfForm'));return}
  var st=status==='error'?('تعذّرت المزامنة'+(lastErr?' ('+esc(lastErr)+')':'')+'. سنعيد المحاولة تلقائيًا.'):(ST[status]||ST.ok);
  var av=user.photoURL?'<img src="'+esc(user.photoURL)+'" alt="" referrerpolicy="no-referrer">':svg('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>');
  b.innerHTML='<div class="grab"></div><div class="pf"><div class="avbig">'+av+'</div>'+
   '<p class="pn">'+esc(user.displayName||'حسابي')+'</p><p class="pe">'+esc(user.email||'')+'</p>'+
   '<p class="ps">'+st+'</p>'+
   '<div class="two"><button class="btn ghost" id="pfSync">مزامنة الآن</button><button class="btn red" id="pfOut">'+(confirmOut?'خروج وتجاهل غير المرفوع':'تسجيل الخروج')+'</button></div></div>';
  $('pfSync').onclick=function(){setStatus('syncing');syncing=false;initialSync()};
  $('pfOut').onclick=logout;
}
async function logout(){
  if(L.getItem('bd2_dirty')==='1'&&!confirmOut){
    await flushNow();
    if(L.getItem('bd2_dirty')==='1'){confirmOut=true;renderProfile();return}
  }
  try{ if(isNative()&&nativeAuth())await nativeAuth().signOut() }catch(e){}
  try{await signOut(auth)}catch(e){}
  ['bd2_s','bd2_dirty','bd2_uid','bd2_gate'].forEach(function(k){L.removeItem(k)});
  L.setItem('bd2_p','[]');
  location.reload();
}

/* ---------- ربط التطبيق ---------- */
window.HamsaCloud={
  user:null,
  push:schedulePush,
  openProfile:function(){confirmOut=false;renderProfile();$('shp').classList.add('open')}
};
onAuthStateChanged(auth,function(u){
  user=u;window.HamsaCloud.user=u;
  if(u){
    L.setItem('bd2_gate','1');$('auth').classList.remove('open');$('authForm').innerHTML='';
    setStatus('syncing');initialSync();
  }else if($('auth').classList.contains('open')){mountAuth($('authForm'))}
  if($('shp').classList.contains('open'))renderProfile();
  window.dispatchEvent(new Event('hamsa-auth'));
});
if($('auth').classList.contains('open')&&!user)mountAuth($('authForm'));
window.addEventListener('online',function(){if(user){flush();initialSync()}});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&user&&Date.now()-lastPull>20000)initialSync()});
</script>
